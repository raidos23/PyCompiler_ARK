name: Release PyCompiler_ARK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka  # Self-build engine

      - name: Lint & Test
        run: |
          ruff check .
          black --check .
          pytest -q

      - name: Self-Build (Nuitka - Linux)
        run: |
          python pycompiler_ark.py workspace apply . --with-venv --strict
          python pycompiler_ark.py engine compile nuitka pycompiler_ark.py --workspace . --onefile

      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pycompiler-ark-linux
          path: |
            pycompiler_ark.*  # Compiled binary + checksums

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            pycompiler_ark.*
          generate_release_notes: true
