repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: run-tests
        name: Run tests with pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
        env:
          QT_QPA_PLATFORM: minimal
        args: ["-q", "--tb=no", "tests/"]