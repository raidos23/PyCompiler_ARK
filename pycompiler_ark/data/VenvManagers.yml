managers:

  pip:
    executor:
      type: python_module
      module: pip

    commands:

      create_venv:
        - -m
        - venv

      install:
        - install
        - -r

      add:
        - install

      check:
        - check

  poetry:
    executor:
      type: executable
      executable: poetry

    commands:

      create_venv:
        - env
        - use

      install:
        - install

      add:
        - add

      check:
        - check