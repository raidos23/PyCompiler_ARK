help: Справка
help_title: Справка
help_text: '<b>PyCompiler ARK — Быстрая справка</b><br><ul><li>1) Выберите рабочую
  папку и добавьте свои .py файлы.</li><li>2) Настройте плагины предварительной компиляции
  через <b>Bc Plugins Loader</b> (BCASL).</li><li>3) Настройте параметры в вкладке
  <b>PyInstaller</b>, <b>Nuitka</b> или <b>CX_Freeze</b>.</li><li>4) Нажмите <b>Сборка</b>
  и следуйте журналам.</li></ul><b>Примечания</b><br><ul><li>При запуске сборки все
  элементы управления действиями отключаются (включая Bc Plugins Loader), пока она
  не завершится или не будет отменена.</li><li>Предварительная компиляция (BCASL)
  завершается перед компиляцией.</li><li><i>venv</i> может быть создан автоматически;
  requirements.txt устанавливается, если присутствует; инструменты устанавливаются
  в venv по мере необходимости.</li><li>Изменения рабочей папки, инициированные Plugins,
  применяются автоматически; выполняющиеся сборки отменяются перед переключением.</li></ul><b>Лицензия</b>:
  Apache-2.0 — <a href=''https://www.apache.org/licenses/LICENSE-2.0''>apache.org/licenses/LICENSE-2.0</a><br><b>Автор</b>:
  Samuel Amen Ague<br>© 2026 Samuel Amen Ague'
