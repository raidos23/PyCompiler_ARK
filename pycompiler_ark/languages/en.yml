help_title: Help
help_text: '<b>PyCompiler ARK — Quick Help</b><br><ul><li>1) Select the Workspace and add your .py files.</li><li>2) Configure or select a virtual environment (venv).</li><li>3) Configure options in the compiler engine tab (PyInstaller, Nuitka, or cx_Freeze).</li><li>4) Click the compile button to build your executable and follow the logs.</li></ul><b>Notes</b><br><ul><li>When a build starts, all action controls are disabled until it finishes or is canceled.</li><li>A <i>venv</i> can be created automatically; requirements.txt is installed if present.</li></ul>'
