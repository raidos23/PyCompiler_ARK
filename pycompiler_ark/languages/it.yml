help: Aiuto
help_title: Aiuto
help_text: '<b>PyCompiler ARK — Guida rapida</b><br><ul><li>1) Seleziona l''Area di
  lavoro e aggiungi i tuoi file .py.</li><li>2) Configura i plugin di pre-compilazione
  tramite <b>Bc Plugins Loader</b> (BCASL).</li><li>3) Regola le opzioni nella scheda
  <b>PyInstaller</b>, <b>Nuitka</b> o <b>CX_Freeze</b>.</li><li>4) Fai clic su <b>Compila</b>
  e segui i log.</li></ul><b>Note</b><br><ul><li>All''avvio di una compilazione, tutti
  i controlli di azione vengono disabilitati (incluso Bc Plugins Loader) fino al completamento
  o all''annullamento.</li><li>La pre-compilazione (BCASL) si completa prima della
  compilazione.</li><li>Un <i>venv</i> può essere creato automaticamente; requirements.txt
  viene installato se presente; gli strumenti vengono installati nel venv se necessario.</li><li>Le
  modifiche all''area di lavoro avviate dai plugin vengono applicate automaticamente;
  le compilazioni in corso vengono annullate prima del cambio.</li></ul><b>Licenza</b>:
  Apache-2.0 — <a href=''https://www.apache.org/licenses/LICENSE-2.0''>apache.org/licenses/LICENSE-2.0</a><br><b>Autore</b>:
  Samuel Amen Ague<br>© 2026 Samuel Amen Ague'
