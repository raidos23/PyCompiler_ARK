help_title: Aide
help_text: '<b>PyCompiler ARK — Aide rapide</b><br><ul><li>1) Sélectionnez le Workspace et ajoutez vos fichiers .py.</li><li>2) Configurez ou sélectionnez un environnement virtuel (venv).</li><li>3) Réglez les options dans l’onglet du moteur de compilation (PyInstaller, Nuitka ou cx_Freeze).</li><li>4) Cliquez sur le bouton de compilation pour générer votre exécutable et suivez les logs.</li></ul><b>Notes</b><br><ul><li>Au démarrage d’un build, tous les contrôles d’action sont désactivés jusqu’à la fin ou l’annulation.</li><li>Un <i>venv</i> peut être créé automatiquement ; requirements.txt est installé s’il est présent.</li></ul>'
