project:
  name: PyCompiler-ARK
  version: 1.0.0
  entry: pycompiler_ark.py
workspace:
  exclude:
  - .ark/**
  - '**/__pycache__/**'
  - '**/*.pyc'
  - '**/*.pyo'
  - '**/*.pyd'
  - .git/**
  - .svn/**
  - .hg/**
  - venv/**
  - .venv/**
  - env/**
  - .env/**
  - node_modules/**
  - build/**
  - dist/**
  - '*.spec'
  - '*.egg-info/**'
  - .pytest_cache/**
  - .mypy_cache/**
  - .tox/**
  - site-packages/**
build:
  engine: pyinstaller
  output: dist/
  data:
  - source: engines/
    destination: engines/
    type: dir
  - source: images/
    destination: images/
    type: dir
  - source: languages/
    destination: languages/
    type: dir
  - source: Plugins/
    destination: Plugins/
    type: dir
  - source: themes/
    destination: themes/
    type: dir
  - source: Ui/Forms/
    destination: Ui/Forms/
    type: dir
  - source: data/
    destination: data/
    type: dir
  exclude: []
  icon: images/logo.png
plugins:
  bcasl_enabled: true
