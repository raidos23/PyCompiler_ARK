    - PyInstaller
    - --noconfirm
    - --onedir
    - --distpath
    - dist/
    - --icon
    - images/logo.png
    - --name
    - PyCompiler-ARK
    - --collect-all
    - Core
    - --collect-all
    - Plugins_SDK
    - --collect-all
    - engine_sdk
    - --collect-all
    - Services
    - --collect-all
    - bcasl
    - --collect-all
    - Loaders
    - --collect-all
    - Ui
    - --add-data
    - engines/:engines/
    - --add-data
    - images/:images/
    - --add-data
    - languages/:languages/
    - --add-data
    - Plugins/:Plugins/
    - --add-data
    - themes/:themes/
    - --add-data
    - Ui/Forms/:Ui/Forms/
    - --add-data
    - data/:data/
    - --collect-all
    - rich
    - --collect-all
    - psutil
    - --collect-all
    - click
    - --collect-all
    - PySide6
    - --hidden-import
    - yaml
    - pycompiler_ark.py
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '0'
      LC_ALL: C
