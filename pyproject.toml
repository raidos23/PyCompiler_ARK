[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycompiler_ark"
version = "1.0.0"
description = "Python Build Studio with multi-engine support and BCASL pre-compile pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
"compiler", 
"build", 
"pyinstaller", 
"nuitka", 
"cx_freeze", 
"gui", 
"cli", 
"executable", 
"pytoexe",
"compilation",
"automation"
]

authors = [
  { name = "Ague Samuel Amen", email = "ague.samuel27@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "psutil",
    "PyYAML>=5.4.1,<7.0.0",
    "jsonschema",
    "click",
    "rich",
    "colorama",
    "future",
    "tomli>=2.0.1,<3.0.0; python_version < '3.11'",
    "PySide6>=6.8,<6.11; python_version >= '3.13'",
    "shiboken6>=6.8,<6.11; python_version >= '3.13'",
    "PySide6>=6.6,<6.8; python_version >= '3.12' and python_version < '3.13'",
    "shiboken6>=6.6,<6.8; python_version >= '3.12' and python_version < '3.13'",
    "PySide6>=6.4,<6.5; python_version >= '3.11' and python_version < '3.12'",
    "shiboken6>=6.4,<6.5; python_version >= '3.11' and python_version < '3.12'",
]

[project.scripts]
pycompiler_ark = "pycompiler_ark.__main__:main"
pycompilerark = "pycompiler_ark.__main__:main"

[project.urls]
Homepage = "https://github.com/raidos23/PyCompiler_ARK"

[tool.hatch.build.targets.wheel]
packages = ["pycompiler_ark"]

[tool.hatch.build.targets.sdist]
include = [
    "pycompiler_ark",
    "README.md",
    "LICENSE",
    "requirements.txt"
]
