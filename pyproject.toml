[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycompiler_ark"
version = "1.1.0"
description = "Python Build Studio with multi-engine support and BCASL pre-compile pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
"compiler", 
"build", 
"pyinstaller", 
"nuitka", 
"cx_freeze", 
"gui", 
"cli", 
"executable", 
"pytoexe",
"compilation",
"automation"
]

authors = [
  { name = "Samuel Amen Ague", email = "ague.samuel27@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  # Core GUI framework (Qt for Python)
  "PySide6>=6.7,<7.0",
  "shiboken6>=6.7,<7.0",
  # System utilities
  "psutil>=7.0,<8.0",
  # Data
  "PyYAML>=6.0,<7.0",
  "tomli>=2.0,<3.0",
  "jsonschema>=4.0,<5.0",
  # CLI
  "click>=8.1,<9.0",
  "rich>=15.0,<16.0",
  "colorama>=0.4,<1.0",
]

[project.scripts]
pycompiler_ark = "pycompiler_ark.__main__:main"
pycompilerark = "pycompiler_ark.__main__:main"

[project.urls]
Homepage = "https://github.com/raidos23/PyCompiler_ARK"

[tool.hatch.build.targets.wheel]
packages = ["pycompiler_ark"]

[tool.hatch.build.targets.sdist]
include = [
    "pycompiler_ark",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CODEOWNERS",
    "requirements.txt"
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402", # Module level import not at top of file
    "E731", # Do not assign a lambda expression, use a def
    "E741", # Ambiguous variable name (e.g. 'l')
    "E501", # Line too long
    "I001", # Import block is un-sorted or un-formatted
    "F811", # Redefinition of unused name
    "F401", # Unused imports
    "F841", # Local variable is assigned to but never used
    "F541", # f-string without placeholders
    "W293", # Blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"] # Ignore unused imports in __init__.py files
